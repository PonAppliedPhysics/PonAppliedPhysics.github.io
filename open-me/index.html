<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>♡</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#fff1f4;color:#873e57;font-family:Georgia,serif;text-align:center}main{padding:32px}button{font:inherit;font-size:21px;background:#a64e6c;color:white;border:0;border-radius:40px;padding:17px 36px;cursor:pointer;box-shadow:0 8px 25px #a64e6c33}h1{font-size:clamp(36px,9vw,72px);font-weight:normal;animation:appear .7s ease}small{color:#946c79}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}</style><main id="main"><button id="open">Open me ♡</button></main><script>const main=document.getElementById('main'),key='pretty-opened-v1';let start=0;try{start=Number(localStorage.getItem(key))||0}catch{}let timer;function render(){if(!start)return;let remaining=Math.max(0,60000-(Date.now()-start));if(!remaining){main.innerHTML='<small>This message has expired. ♡</small>';clearInterval(timer);return}if(!document.getElementById('count'))main.innerHTML='<h1>You’re pretty ♡</h1><small id="count"></small>';document.getElementById('count').textContent=Math.ceil(remaining/1000)+'s';}document.getElementById('open').onclick=()=>{if(start)return;start=Date.now();try{localStorage.setItem(key,String(start))}catch{}render();timer=setInterval(render,200)};if(start){render();if(Date.now()-start<60000)timer=setInterval(render,200)}document.addEventListener('visibilitychange',render);</script></html>
